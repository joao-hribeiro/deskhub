<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Desk Hub</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="nav-rail" class="nav-rail" aria-label="Navegação">
      <div class="nav-status" id="nav-status" title="Status da conexão">
        <span class="status-dot offline" id="status-dot"></span>
      </div>
      <nav id="nav-items" class="nav-items"></nav>
      <div class="nav-footer">
        <button id="btn-fullscreen" class="nav-btn util-btn" type="button" title="Tela cheia">
          <span class="nav-ico" data-icon="fullscreen"></span>
        </button>
      </div>
    </aside>

    <main id="main-area" class="main-area">
      <header id="top-bar" class="top-bar">
        <div class="top-clock-group">
          <span id="hdr-time" class="hdr-time">--:--</span>
          <span id="hdr-date" class="hdr-date">---</span>
        </div>
        <div class="top-meta">
          <span id="hdr-page-title" class="hdr-page-title">Home</span>
          <span id="hdr-pc-badge" class="badge badge-offline">PC offline</span>
        </div>
      </header>

      <section id="page-container" class="page-container"></section>
    </main>
  </div>

  <!-- Sleep / Night Dim Overlay -->
  <div id="sleep-overlay" class="sleep-overlay hidden" role="button" tabindex="0">
    <div id="sleep-clock-box" class="sleep-clock-box">
      <div id="sleep-time" class="sleep-time">--:--</div>
      <div id="sleep-date" class="sleep-date">---</div>
      <div class="sleep-hint">Toque para acender</div>
    </div>
  </div>

  <!-- Timer Alarm Overlay -->
  <div id="timer-alarm" class="timer-alarm hidden">
    <div class="alarm-card">
      <div class="alarm-title">Tempo esgotado!</div>
      <div id="alarm-sub" class="alarm-sub">Timer concluído</div>
      <button id="btn-alarm-ok" class="btn-primary alarm-btn" type="button">OK</button>
    </div>
  </div>

  <script src="/NoSleep.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
