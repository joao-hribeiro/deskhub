<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Desk Hub</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="app-shell" data-nav="left">
    <aside id="nav-rail" class="nav-rail" aria-label="Navegação">
      <nav id="nav-items" class="nav-items"></nav>
      <div class="nav-footer">
        <button id="btn-fullscreen" class="nav-btn util-btn" type="button" title="Tela cheia">
          <span class="mi">&#xe5d0;</span>
        </button>
        <div id="nav-status" class="nav-status" title="Status da conexão">
          <span id="status-pc" class="mi status-ico dim" title="PC">&#xe30c;</span>
          <span id="status-wifi" class="mi status-ico bad" title="Conexão">&#xe648;</span>
        </div>
      </div>
    </aside>

    <main id="main-area" class="main-area">
      <section id="page-container" class="page-container"></section>
    </main>
  </div>

  <!-- Sleep / Night Dim Overlay (ui_saver.c) -->
  <div id="sleep-overlay" class="sleep-overlay hidden" role="button" tabindex="0">
    <div id="sleep-clock-box" class="sleep-clock-box">
      <div id="sleep-time" class="sleep-time">--:--</div>
      <div id="sleep-date" class="sleep-date"></div>
    </div>
  </div>

  <!-- Timer Alarm Overlay (ui_timer.c build_done) -->
  <div id="timer-alarm" class="timer-alarm hidden">
    <div class="alarm-card">
      <span class="mi alarm-icon">&#xe425;</span>
      <div class="alarm-title">Tempo esgotado</div>
      <div id="alarm-sub" class="alarm-sub">Timer de 25 minutos</div>
      <div class="alarm-actions">
        <button id="btn-alarm-again" class="pill-btn pill-muted" type="button">Repetir</button>
        <button id="btn-alarm-ok" class="pill-btn pill-accent" type="button">Concluir</button>
      </div>
    </div>
  </div>

  <script src="/NoSleep.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
